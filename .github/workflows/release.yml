name: Release on Latest Push

on:
  push:
    branches:
      - latest  # Explicitly targets the 'latest' branch

jobs:
  release:
    # Triggers only when your commit message starts with "release:"
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag from commit message
        id: get_version
        run: |
          # Parses "release: v1.0.0" -> "v1.0.0"
          VERSION=$(echo "${{ github.event.head_commit.message }}" | sed -n 's/^release:[[:space:]]*//p' | head -n 1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body_path: CHANGELOG.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
